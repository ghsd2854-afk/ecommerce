server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    # Do not reveal the nginx version in headers or error pages
    server_tokens off;

    # Product images can be up to 2 MB (validated by Laravel).
    # nginx's default limit is 1 MB, which would reject valid uploads with an HTML 413.
    client_max_body_size 3m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
