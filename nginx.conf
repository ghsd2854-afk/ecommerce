server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    # Do not reveal the nginx version in headers or error pages
    server_tokens off;

    # Product images can be up to 2 MB (validated by Laravel).
    # nginx's default limit is 1 MB, which would reject valid uploads.
    client_max_body_size 3m;

    # Errors produced by nginx itself (not by Laravel) also use the API's unified
    # JSON error format instead of nginx's HTML error pages.
    error_page 413 @payload_too_large;
    error_page 502 503 504 @app_unavailable;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"status":413,"code":"PAYLOAD_TOO_LARGE","message":"The request is too large (maximum 3 MB)."}';
    }

    location @app_unavailable {
        default_type application/json;
        return 502 '{"status":502,"code":"BAD_GATEWAY","message":"The application server is not available. Please try again later."}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
