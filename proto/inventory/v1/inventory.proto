// Shared contract between the main application (Laravel / PHP)
// and the inventory service (Node.js). Both sides are built from this file only.
syntax = "proto3";

package inventory.v1;

option php_namespace = "Modules\\Inventory\\Grpc";
option php_metadata_namespace = "Modules\\Inventory\\Grpc\\Metadata";

service InventoryService {
  // 1) How many units of this product are left?
  rpc GetStock (GetStockRequest) returns (GetStockResponse);

  // 2) Reserve the quantities of ALL the items of one order in a single call.
  //    All-or-nothing: either every item is reserved or nothing is.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);

  // 3) Give back what a reservation took (used when saving the order fails).
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetStockRequest {
  int64 product_id = 1;
}

message GetStockResponse {
  int64 product_id = 1;
  int32 available_quantity = 2;
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  // Unique id generated by the caller (UUID). Makes the call safe to retry
  // and lets the caller release exactly this reservation later.
  string reservation_id = 1;
  repeated StockItem items = 2;
}

message StockShortage {
  int64 product_id = 1;
  int32 requested = 2;
  int32 available = 3;
}

message ReserveStockResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
  // Filled when success = false because of insufficient stock.
  repeated StockShortage shortages = 4;
}

message ReleaseStockRequest {
  string reservation_id = 1;
}

message ReleaseStockResponse {
  bool released = 1;
  string message = 2;
}
